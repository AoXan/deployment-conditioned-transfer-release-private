notes:
  - Restricted or provenance-unresolved source data and checkpoints are not included.
  - The Waite workbook is openly licensed under CC BY 4.0 and is acquired from the official CSIRO record rather than vendored.
  - The exact accepted Roseworthy and Waite preprocessing script snapshots are included with immutable hashes.
  - The APSIM runtime is fetched from its pinned upstream source by the bootstrap command.
  - Derived publication source tables are included only where redistribution is permitted.
